<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recap Studio — Option B (Design System)</title>
    <link rel="stylesheet" href="./design-system.css" />
    <style>
      /* Prototype harness only — not part of the product design system. */
      body {
        padding: 0;
      }

      .app-nav {
        background: var(--n-0);
        border-bottom: 1px solid var(--n-200);
        padding: 14px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .app-nav .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .brand-mark {
        width: 28px;
        height: 28px;
        border-radius: var(--radius-md);
        background: var(--a-500);
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 13px;
      }

      .avatar {
        width: 30px;
        height: 30px;
        border-radius: var(--radius-full);
        background: var(--n-200);
        display: grid;
        place-items: center;
        font: var(--text-caption);
        color: var(--n-700);
        font-weight: 700;
      }

      .harness {
        max-width: 1180px;
        margin: 0 auto;
        padding: 28px 24px 80px;
      }

      .proto-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 18px;
      }

      .switcher {
        display: flex;
        gap: 8px;
      }

      .switcher a {
        text-decoration: none;
        font: var(--text-caption);
        color: var(--n-600);
        border: 1px solid var(--n-200);
        background: var(--n-0);
        border-radius: var(--radius-full);
        padding: 7px 12px;
      }

      .switcher a.current {
        background: var(--a-50);
        border-color: var(--a-400);
        color: var(--a-600);
        font-weight: 700;
      }

      .proto-controls {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .proto-controls .ds-caption {
        margin-right: 4px;
      }

      .step-jump {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }

      .step-jump button {
        border: 1px solid var(--n-200);
        background: var(--n-0);
        color: var(--n-600);
        border-radius: var(--radius-full);
        font: var(--text-caption);
        padding: 5px 10px;
        cursor: pointer;
      }

      .step-jump button.active {
        border-color: var(--a-500);
        background: var(--a-50);
        color: var(--a-600);
        font-weight: 700;
      }

      .preview-heading {
        margin-top: 6px;
      }

      .dual-preview {
        margin-top: 20px;
        display: grid;
        grid-template-columns: 1fr 340px;
        gap: 18px;
      }

      .preview-card {
        border: 1px solid var(--n-200);
        border-radius: var(--radius-lg);
        background: var(--n-0);
        overflow: hidden;
      }

      .preview-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 14px;
        border-bottom: 1px solid var(--n-100);
        background: var(--n-50);
        font: var(--text-caption);
        color: var(--n-500);
      }

      .desktop-canvas {
        min-height: 460px;
        padding: 28px;
        display: flex;
        justify-content: center;
      }

      .desktop-canvas > .screen-card {
        width: 100%;
        max-width: 560px;
      }

      .phone-shell {
        border: 8px solid var(--n-900);
        border-radius: 32px;
        max-width: 260px;
        margin: 16px auto;
        overflow: hidden;
        background: var(--n-0);
      }

      .phone-notch {
        width: 100px;
        height: 18px;
        background: var(--n-900);
        margin: 0 auto;
        border-radius: 0 0 10px 10px;
      }

      .phone-canvas {
        min-height: 520px;
        display: flex;
        flex-direction: column;
        background: var(--n-50);
      }

      .phone-topbar {
        padding: 10px 14px;
        background: var(--n-0);
        border-bottom: 1px solid var(--n-200);
        font: var(--text-label);
        color: var(--n-800);
      }

      .phone-body {
        padding: 14px;
        flex: 1;
      }

      .phone-cta-bar {
        padding: 12px 14px;
        border-top: 1px solid var(--n-200);
        background: var(--n-0);
        display: grid;
        gap: 8px;
      }

      .screen-card {
        border: 1px solid var(--n-200);
        border-radius: var(--radius-lg);
        background: var(--n-0);
        box-shadow: var(--elevation-1);
        padding: 22px;
      }

      .field-list {
        display: grid;
        gap: 12px;
        margin-top: 14px;
      }

      @media (max-width: 980px) {
        .dual-preview {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <nav class="app-nav">
      <div class="brand">
        <span class="brand-mark">R</span>
        <strong class="ds-h3">Recap Studio</strong>
      </div>
      <div class="avatar">MK</div>
    </nav>

    <div class="harness">
      <div class="proto-bar">
        <div class="switcher">
          <a href="./mockup-option-a.html">Option A: Voice Memo First</a>
          <a class="current" href="./mockup-option-b.html">Option B: Guided Recorder</a>
          <a href="./mockup-option-c.html">Option C: Tape Deck</a>
          <a href="./style-guide.html">Design System Reference</a>
        </div>
        <div class="proto-controls">
          <span class="ds-caption">Prototype controls:</span>
          <button id="prevBtn" class="btn btn-secondary" type="button">Previous</button>
          <button id="nextBtn" class="btn btn-primary" type="button">Next</button>
          <div id="step-jump" class="step-jump"></div>
        </div>
      </div>

      <p class="ds-overline">Happy path · rebuilt on the Recap Studio design system</p>
      <h1 id="step-title" class="ds-display preview-heading"></h1>
      <p id="step-sub" class="ds-body" style="margin-top:8px; max-width:64ch;"></p>

      <div class="dual-preview">
        <div class="preview-card">
          <div class="preview-head">
            <span>Desktop</span>
            <span id="step-name-desktop"></span>
          </div>
          <div id="desktop-stage" class="desktop-canvas"></div>
        </div>

        <div class="preview-card">
          <div class="preview-head">
            <span>Mobile</span>
            <span id="step-name-mobile"></span>
          </div>
          <div class="phone-shell">
            <div class="phone-notch"></div>
            <div id="mobile-stage" class="phone-canvas"></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const steps = [
        {
          name: "Start brief",
          title: "Start a wedding recap",
          sub: "One tap begins a new session. A short checklist sets expectations before recording, without a long form.",
          desktop: `
            <div class="screen-card">
              <p class="ds-overline">New recap</p>
              <h2 class="ds-h2" style="margin-top:8px;">Before you record</h2>
              <div class="callout" style="margin-top:14px;">
                Mention couple names, venue and city/state, timeline highlights, and any signature moments.
                Aim for 4–7 minutes.
              </div>
              <div class="row" style="margin-top:18px; display:flex; gap:10px;">
                <button class="btn btn-primary" type="button">Start recording</button>
                <button class="btn btn-ghost" type="button">How this works</button>
              </div>
            </div>
          `,
          mobile: `
            <div class="phone-topbar">New recap</div>
            <div class="phone-body">
              <p class="ds-overline">Before you record</p>
              <div class="callout" style="margin-top:10px;">
                Mention names, venue, city/state, timeline, and standout moments. 4–7 minutes is ideal.
              </div>
            </div>
            <div class="phone-cta-bar">
              <button class="btn btn-primary btn-block" type="button">Start recording</button>
            </div>
          `
        },
        {
          name: "Recording",
          title: "Recording",
          sub: "Flat record control with live waveform and a plain-language noise quality signal, no color-only status.",
          desktop: `
            <div class="screen-card" style="text-align:center;">
              <button class="record-control is-recording" type="button" style="margin: 0 auto;">
                <span>
                  <span class="rc-label">Recording</span>
                  <span class="rc-time">02:18</span>
                </span>
              </button>
              <div class="waveform" style="margin-top:18px;">${"<span></span>".repeat(13)}</div>
              <p class="ds-caption" style="margin-top:10px;">Input level: Good</p>
              <span class="badge badge-warning" style="margin-top:6px; display:inline-flex;">Noise: Fair</span>
              <div class="row" style="margin-top:20px; display:flex; gap:10px; justify-content:center;">
                <button class="btn btn-secondary" type="button">Pause</button>
                <button class="btn btn-primary" type="button">Stop recording</button>
              </div>
            </div>
          `,
          mobile: `
            <div class="phone-topbar">Recording</div>
            <div class="phone-body" style="text-align:center;">
              <button class="record-control is-recording" type="button" style="width:130px; margin: 8px auto;">
                <span>
                  <span class="rc-label">Live</span>
                  <span class="rc-time">02:18</span>
                </span>
              </button>
              <div class="waveform" style="margin-top:14px;">${"<span></span>".repeat(11)}</div>
              <span class="badge badge-warning" style="margin-top:8px; display:inline-flex;">Noise: Fair</span>
            </div>
            <div class="phone-cta-bar">
              <button class="btn btn-secondary btn-block" type="button">Pause</button>
              <button class="btn btn-primary btn-block" type="button">Stop recording</button>
            </div>
          `
        },
        {
          name: "Review",
          title: "Review before you submit",
          sub: "Transcript is available on request. Missing required fields are shown as a plain checklist, not an error state.",
          desktop: `
            <div class="screen-card">
              <p class="ds-overline">Transcript</p>
              <div class="callout" style="margin-top:10px;">
                Alex and Conner wedding recap at Walt Disney World Swan Hotel, Lake Buena Vista…
              </div>
              <button class="btn btn-ghost" type="button" style="margin-top:6px; padding-left:0;">Show full transcript</button>

              <p class="ds-overline" style="margin-top:18px;">Required details</p>
              <div class="field-list">
                <div class="check-row"><span class="check-icon ok">✓</span><span class="ds-body">Couple names</span></div>
                <div class="check-row"><span class="check-icon ok">✓</span><span class="ds-body">Venue name</span></div>
                <div class="check-row"><span class="check-icon missing">!</span><span class="ds-body">Venue city/state</span></div>
              </div>

              <div class="row" style="margin-top:18px; display:flex; gap:10px;">
                <button class="btn btn-secondary" type="button">Answer 1 question</button>
                <button class="btn btn-primary" type="button">Approve and submit</button>
              </div>
            </div>
          `,
          mobile: `
            <div class="phone-topbar">Review</div>
            <div class="phone-body">
              <div class="callout">Transcript preview available</div>
              <div class="field-list" style="margin-top:10px;">
                <div class="check-row"><span class="check-icon ok">✓</span><span class="ds-body">Couple names</span></div>
                <div class="check-row"><span class="check-icon missing">!</span><span class="ds-body">Venue city/state</span></div>
              </div>
            </div>
            <div class="phone-cta-bar">
              <button class="btn btn-secondary btn-block" type="button">Answer 1 question</button>
              <button class="btn btn-primary btn-block" type="button">Approve and submit</button>
            </div>
          `
        },
        {
          name: "Processing",
          title: "Sending your recap",
          sub: "Stage status is explicit and named, and the delivery destination is always visible.",
          desktop: `
            <div class="screen-card">
              <div class="stepper">
                <div class="step is-done"><div class="step-track"><i></i></div><div class="step-label">Upload</div></div>
                <div class="step is-active"><div class="step-track"><i></i></div><div class="step-label">Transcribe</div></div>
                <div class="step is-pending"><div class="step-track"><i></i></div><div class="step-label">Draft</div></div>
                <div class="step is-pending"><div class="step-track"><i></i></div><div class="step-label">Deliver</div></div>
              </div>
              <div class="callout" style="margin-top:18px;">Destination: <strong>michael@authormadephoto.com</strong></div>
            </div>
          `,
          mobile: `
            <div class="phone-topbar">Sending</div>
            <div class="phone-body">
              <div class="field-list">
                <div class="data-row"><span class="ds-body">Upload</span><span class="badge badge-success">Done</span></div>
                <div class="data-row"><span class="ds-body">Transcribe</span><span class="badge badge-info">Active</span></div>
                <div class="data-row"><span class="ds-body">Draft</span><span class="badge badge-neutral">Pending</span></div>
                <div class="data-row"><span class="ds-body">Deliver</span><span class="badge badge-neutral">Pending</span></div>
              </div>
              <div class="callout" style="margin-top:12px;">To: michael@authormadephoto.com</div>
            </div>
          `
        },
        {
          name: "Done",
          title: "Recap sent",
          sub: "Success is explicit with timestamp and destination, plus visibility into recent submissions.",
          desktop: `
            <div class="screen-card">
              <div class="check-row"><span class="check-icon ok">✓</span><span class="ds-body">Sent today at 4:12 PM to michael@authormadephoto.com</span></div>
              <p class="ds-overline" style="margin-top:20px;">Recent submissions</p>
              <div class="field-list" style="margin-top:8px;">
                <div class="data-row"><span class="ds-body">Sep 7, 4:12 PM</span><span class="badge badge-success">Sent</span></div>
                <div class="data-row"><span class="ds-body">Sep 6, 8:43 PM</span><span class="badge badge-success">Sent</span></div>
                <div class="data-row"><span class="ds-body">Sep 5, 1:09 PM</span><span class="badge badge-warning">Needs retry</span></div>
              </div>
              <div class="row" style="margin-top:18px;">
                <button class="btn btn-primary" type="button">Start new recap</button>
              </div>
            </div>
          `,
          mobile: `
            <div class="phone-topbar">Done</div>
            <div class="phone-body">
              <div class="check-row"><span class="check-icon ok">✓</span><span class="ds-body">Sent 4:12 PM</span></div>
              <p class="ds-overline" style="margin-top:14px;">Recent</p>
              <div class="field-list" style="margin-top:8px;">
                <div class="data-row"><span class="ds-body">Sep 7</span><span class="badge badge-success">Sent</span></div>
                <div class="data-row"><span class="ds-body">Sep 6</span><span class="badge badge-success">Sent</span></div>
                <div class="data-row"><span class="ds-body">Sep 5</span><span class="badge badge-warning">Retry</span></div>
              </div>
            </div>
            <div class="phone-cta-bar">
              <button class="btn btn-primary btn-block" type="button">Start new recap</button>
            </div>
          `
        }
      ];

      let currentStep = 0;
      const titleEl = document.getElementById("step-title");
      const subEl = document.getElementById("step-sub");
      const desktopNameEl = document.getElementById("step-name-desktop");
      const mobileNameEl = document.getElementById("step-name-mobile");
      const desktopStageEl = document.getElementById("desktop-stage");
      const mobileStageEl = document.getElementById("mobile-stage");
      const stepJumpEl = document.getElementById("step-jump");
      const nextBtn = document.getElementById("nextBtn");
      const prevBtn = document.getElementById("prevBtn");

      function renderStepJump() {
        stepJumpEl.innerHTML = steps
          .map(
            (step, index) =>
              `<button type="button" class="${index === currentStep ? "active" : ""}" data-step="${index}">${index + 1}</button>`
          )
          .join("");

        Array.from(stepJumpEl.querySelectorAll("button")).forEach((button) => {
          button.addEventListener("click", () => {
            currentStep = Number(button.dataset.step);
            renderStep();
          });
        });
      }

      function renderStep() {
        const step = steps[currentStep];
        titleEl.textContent = step.title;
        subEl.textContent = step.sub;
        desktopNameEl.textContent = `Step ${currentStep + 1} of ${steps.length} · ${step.name}`;
        mobileNameEl.textContent = step.name;
        desktopStageEl.innerHTML = step.desktop;
        mobileStageEl.innerHTML = step.mobile;
        prevBtn.disabled = currentStep === 0;
        nextBtn.disabled = currentStep === steps.length - 1;
        renderStepJump();
      }

      nextBtn.addEventListener("click", () => {
        if (currentStep < steps.length - 1) {
          currentStep += 1;
          renderStep();
        }
      });

      prevBtn.addEventListener("click", () => {
        if (currentStep > 0) {
          currentStep -= 1;
          renderStep();
        }
      });

      renderStep();
    </script>
  </body>
</html>
